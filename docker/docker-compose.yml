version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: sitemap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.simple
    container_name: sitemap-api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - ../outputs:/app/outputs
    depends_on:
      - redis
    restart: unless-stopped

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.simple
    container_name: sitemap-celery-worker
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - ../outputs:/app/outputs
    depends_on:
      - redis
    restart: unless-stopped
    command: celery -A backend.celery_app worker --loglevel=info

  celery-flower:
    image: mher/flower:0.9.7
    container_name: sitemap-celery-flower
    command: ['flower', '--broker=redis://redis:6379/0', '--port=5555']
    ports:
      - "5555:5555"
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data: