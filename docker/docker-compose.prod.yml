version: '3.8'

services:
  # Redis for job queue and caching
  redis:
    image: redis:7-alpine
    container_name: llmstxt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: llmstxt-backend
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - outputs:/app/outputs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Worker
  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile.prod
    container_name: llmstxt-worker
    restart: unless-stopped
    command: celery -A celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - outputs:/app/outputs
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # Caddy - Reverse Proxy + Static File Server + SSL
  caddy:
    image: caddy:2-alpine
    container_name: llmstxt-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ../client/dist:/var/www/html
      - ./Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - backend
    environment:
      - DOMAIN=llmstxtgenerator.devopsfrontier.com  # Your domain

volumes:
  redis_data:
  outputs:
  caddy_data:
  caddy_config:

networks:
  default:
    name: llmstxt-network
